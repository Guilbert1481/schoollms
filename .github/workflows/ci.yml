name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP 8.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, intl, pdo_sqlite, sqlite3, gd, zip, fileinfo, exif
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      # Tests run against sqlite :memory: (see phpunit.xml), but Feature tests
      # that render Blade views need the Vite manifest — so build assets first.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build front-end assets
        run: |
          npm ci
          npm run build

      - name: Run tests
        run: composer test

  code-style:
    name: Pint (code style)
    runs-on: ubuntu-latest
    # NOTE: non-blocking for now — the legacy tree is not yet Pint-formatted, so a
    # strict check would fail on pre-existing files. Once you run `vendor/bin/pint`
    # on a clean tree (as its own dedicated commit), delete this line so code style
    # becomes a required, blocking check going forward.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

  static-analysis:
    name: Larastan (static analysis)
    runs-on: ubuntu-latest
    # NOTE: non-blocking until a baseline is committed and the level is raised.
    # Generate the baseline with `vendor/bin/phpstan analyse --generate-baseline`,
    # commit it, then delete this line to make static analysis a blocking check.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, intl, pdo_sqlite, sqlite3, gd, zip, fileinfo, exif, curl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Larastan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
