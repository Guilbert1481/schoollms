name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP 8.2)
    runs-on: ubuntu-latest

    # The app targets MySQL and its migrations use MySQL-specific DDL, so the
    # suite runs against a real, isolated MySQL database (schoollms_test) — not
    # sqlite. RefreshDatabase loads database/schema/mysql-schema.sql into it.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: schoollms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, intl, pdo_mysql, mysqli, gd, zip, fileinfo, exif
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      # Feature tests that render Blade views need the Vite manifest — build
      # assets first.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build front-end assets
        run: |
          npm ci
          npm run build

      - name: Run tests
        env:
          # phpunit.xml pins the connection (mysql) and database (schoollms_test);
          # point it at the service container here.
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: composer test

  code-style:
    name: Pint (code style)
    runs-on: ubuntu-latest
    # NOTE: non-blocking for now — the legacy tree is not yet Pint-formatted, so a
    # strict check would fail on pre-existing files. Once you run `vendor/bin/pint`
    # on a clean tree (as its own dedicated commit), delete this line so code style
    # becomes a required, blocking check going forward.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

  static-analysis:
    name: Larastan (static analysis)
    runs-on: ubuntu-latest
    # NOTE: non-blocking until a baseline is committed and the level is raised.
    # Generate the baseline with `vendor/bin/phpstan analyse --generate-baseline`,
    # commit it, then delete this line to make static analysis a blocking check.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, intl, pdo_sqlite, sqlite3, gd, zip, fileinfo, exif, curl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Larastan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  security-audit:
    name: Dependency audit (composer + npm)
    runs-on: ubuntu-latest
    # NOTE: non-blocking for now (Roadmap S1) — known CVEs in dependencies are
    # the most common real-world entry point, so surface them on every PR
    # first. Once the current advisories are triaged/patched, delete this line
    # to make a vulnerable dependency a blocking failure.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit Composer dependencies
        run: composer audit --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Audit npm dependencies
        run: |
          npm ci
          npm audit --audit-level=high
