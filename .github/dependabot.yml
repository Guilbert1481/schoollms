# Roadmap S2 — Dependabot keeps dependencies patched and flags vulnerable
# versions with PRs. Weekly so the noise stays manageable; security updates
# are raised immediately by GitHub regardless of this schedule. Grouped so a
# routine bump is one PR, not dozens.
version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      php-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      js-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
